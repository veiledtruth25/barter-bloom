<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Barter Bloom — Cerita Desa</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="/v/__BUILD__/css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="card date">
      <div class="gem"></div>
      <div class="dm"><div id="dateText" class="big"></div><div id="clockText" class="clock"></div></div>
      <div id="seasonIcon" class="season"></div>
    </div>
    <div class="subinfo"><span id="seasonName"></span> · <span id="weatherText"></span><br><small id="forecastText"></small></div>
    <div class="card stamina"><div id="faceIcon" class="face">😄</div><div class="bar"><div id="staminaBar"></div></div></div>
    <div class="card tool" id="toolBtn"><span id="toolIcon"></span><span id="toolName"></span><kbd>Q</kbd></div>
    <div class="card gold" id="goldText"></div>
    <button class="card bag" id="bagBtn">🎒 <kbd>I</kbd></button>
    <div id="prompt" class="prompt hidden"></div>
    <div class="help">WASD gerak · Shift lari · Spasi pakai alat · E interaksi/panen · Q ganti alat · I tas · V warga · M suara · Esc menu</div>
  </div>

  <div id="dialog" class="hidden"></div>
  <div id="modal" class="panel modal hidden"></div>
  <div id="rucksack" class="panel hidden"><h3>🎒 Rucksack</h3><div id="slots"></div></div>
  <div id="toasts"></div>
  <div id="fade"><div id="fadeText"></div></div>

  <div id="menu">
    <div class="menu-panel">
      <h1>Barter <span>Bloom</span></h1>
      <p>Cerita pertanian di desa kecil.</p>
      <label>Nama petani <input id="nameInput" maxlength="12" placeholder="Petani" /></label>
      <div id="slotList"></div>
    </div>
  </div>

  <script type="module" src="/v/__BUILD__/js/main.js"></script>
</body>
</html>
